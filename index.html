<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>예약 마감 · 더클라쓰한강 여의도점</title>
<meta name="description" content="9월 5일 서울세계불꽃축제 좌석 예약이 모두 마감되었습니다. 밤 10시 30분 이후 단독 대관은 문의해 주세요.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#070B1E;
    --navy:#0E1633;
    --gold:#F5C15C;
    --ivory:#F4EFE6;
    --dim:#9AA3C0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--night);
    color:var(--ivory);
    font-family:'Noto Sans KR',system-ui,-apple-system,sans-serif;
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    padding:32px 20px;
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:420px;text-align:center;
  }
  .brand{
    font-size:12px;letter-spacing:.18em;color:var(--dim);
    text-transform:uppercase;margin-bottom:28px;
  }
  h1{
    font-family:'Noto Serif KR',serif;font-weight:900;
    font-size:26px;line-height:1.5;margin-bottom:14px;
  }
  .sub{color:var(--dim);font-size:14px;margin-bottom:36px}
  .box{
    border:1px dashed rgba(245,193,92,.4);
    border-radius:14px;
    padding:22px 20px;
    text-align:left;
    margin-bottom:26px;
  }
  .box b{color:var(--gold);display:block;font-size:15px;margin-bottom:8px}
  .box p{font-size:14px;color:var(--ivory)}
  .box .meta{color:var(--dim);font-size:13px;margin-top:8px}
  .cta{
    display:block;
    background:var(--gold);color:#1A1206;
    font-weight:700;font-size:16px;
    text-decoration:none;
    border-radius:999px;
    padding:15px 20px;
  }
  .foot{margin-top:26px;font-size:12px;color:var(--dim)}
</style>
</head>
<body>
  <div class="card">
    <p class="brand">더클라쓰한강 여의도점</p>
    <h1>예약이 모두<br>마감되었습니다</h1>
    <p class="sub">9월 5일 서울세계불꽃축제 좌석</p>

    <div class="box">
      <b>🌙 심야 단독 대관은 문의 가능합니다</b>
      <p>밤 10시 30분 이후 공간 전체를 단독으로 사용하실 수 있습니다.</p>
      <p class="meta">15만원 · 익일 오전 11시까지 · 약 12시간</p>
    </div>

    <a class="cta" href="tel:010-4240-7708">📞 전화로 문의하기</a>
    <p class="foot">문의 010-4240-7708</p>
  </div>
</body>
</html>
